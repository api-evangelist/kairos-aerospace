name: Kairos Aerospace
description: >-
  Kairos Aerospace is a methane-detection company founded in 2014 in Sunnyvale,
  California that provides cost-effective, high-frequency aerial methane
  detection for the oil and gas industry. Its patented LeakSurveyor spectrometer
  is flown over upstream and midstream infrastructure to image methane plumes,
  and proprietary software turns those flights into actionable emissions data so
  operators can find, prioritize, and fix leaks. The company rebranded as
  Insight M in March 2024 and was subsequently acquired by Zeitview. Kairos
  Aerospace was surfaced as a portfolio company of DCVC and added to the API
  Evangelist network. It publishes no public developer API, SDK, or
  documentation surface, so this profile is an identity record rather than an
  API catalog entry.
